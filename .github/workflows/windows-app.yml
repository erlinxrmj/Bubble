name: Bubble für Windows bauen

on:
  push:
    branches: [main]
    paths: ['client/**', '.github/workflows/windows-app.yml']
  workflow_dispatch: {}

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: Bubble-Windows-Installer
          path: client/dist/*.exe
