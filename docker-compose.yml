# Bubble-Server: läuft auf Oracle Cloud, Raspberry Pi (64-Bit) oder jedem Linux-PC.
# Caddy und LiveKit nutzen das Host-Netzwerk: spart auf dem Pi viel RAM
# (keine 100 Port-Weiterleitungen) und Calls im selben WLAN laufen direkt.

x-logging: &logging
  driver: json-file
  options:
    max-size: "5m"
    max-file: "2"

services:
  # HTTPS-Zertifikate automatisch (Let's Encrypt) + Weiterleitung
  caddy:
    image: caddy:2
    restart: unless-stopped
    network_mode: host
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    logging: *logging
    depends_on:
      - server
      - livekit

  # Chat, Konten, Gruppen (nur lokal erreichbar, Caddy leitet weiter)
  server:
    build: ./server
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      JWT_SECRET: ${JWT_SECRET}
      REGISTRATION_CODE: ${REGISTRATION_CODE}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET}
      LIVEKIT_PUBLIC_URL: wss://rtc.${DOMAIN}
    volumes:
      - ./data:/data
    logging: *logging

  # Sprache, Video, Bildschirm teilen
  livekit:
    image: livekit/livekit-server:latest
    restart: unless-stopped
    network_mode: host
    command: --config /etc/livekit.yaml
    environment:
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}"
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro
    logging: *logging

  # Hält die DuckDNS-Adresse aktuell, wenn sich die IP zu Hause ändert.
  # Wird nur gestartet, wenn in der .env COMPOSE_PROFILES=duckdns steht (setup.sh macht das).
  duckdns:
    image: lscr.io/linuxserver/duckdns:latest
    profiles: ["duckdns"]
    restart: unless-stopped
    environment:
      SUBDOMAINS: ${DUCKDNS_SUBDOMAIN:-}
      TOKEN: ${DUCKDNS_TOKEN:-}
      UPDATE_IP: ipv4
      LOG_FILE: "false"
      TZ: Europe/Zurich
    logging: *logging

volumes:
  caddy_data:
  caddy_config:
